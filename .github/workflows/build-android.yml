name: OptiMem 0.1 - APK direct
on:
  push:
    branches:
      - 'feature/optimem-v0.1.0-native-memory'
    paths-ignore:
      - 'temp/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Installer Android SDK 36 avec le sdkmanager préinstallé
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compiler un vrai APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Produire APK direct et empreinte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp
          cp app/build/outputs/apk/debug/app-debug.apk temp/OptiMem-v0.1.0-debug.apk
          (cd temp && sha256sum OptiMem-v0.1.0-debug.apk > OptiMem-v0.1.0-debug.apk.sha256)
          file temp/OptiMem-v0.1.0-debug.apk
          cat temp/OptiMem-v0.1.0-debug.apk.sha256
      - name: Sauvegarder artefact de secours CI
        uses: actions/upload-artifact@v4
        with:
          name: OptiMem-v0.1.0-debug
          path: temp/OptiMem-v0.1.0-debug.apk
      - name: Publier le .apk brut sous temp sans Release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f temp/OptiMem-v0.1.0-debug.apk temp/OptiMem-v0.1.0-debug.apk.sha256
          if git diff --cached --quiet; then
            echo 'APK direct identique, pas de nouveau commit'
          else
            git commit -m 'build: direct signed debug APK v0.1.0 (temp)'
            git push origin HEAD:feature/optimem-v0.1.0-native-memory
          fi
